<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Drive Picker</title>
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        const CLIENT_ID = urlParams.get('client_id');
        const APP_ID = urlParams.get('app_id');
        const SCHEME = urlParams.get('scheme');

        let tokenClient;
        let accessToken = null;
        let pickerInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('picker', { callback: () => { pickerInited = true; } });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        createPicker();
                    }
                },
            });
            gisInited = true;
        }

        // Triggered explicitly by user click to comply with browser pop-up policies
        function handleAuthClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            }
        }

        function createPicker() {
            document.getElementById('loaderText').style.display = 'none';
            document.getElementById('authButton').style.display = 'none';

            let view = new google.picker.View(google.picker.ViewId.DOCS);
            view.setMimeTypes('audio/mpeg,audio/mp4,audio/wav,audio/aac,audio/x-m4a');

            let picker = new google.picker.PickerBuilder()
                .enableFeature(google.picker.Feature.NAV_HIDDEN)
                .setAppId(APP_ID)
                .setOAuthToken(accessToken)
                .addView(view)
                .setCallback(pickerCallback)
                .build();
            picker.setVisible(true);
        }

        function pickerCallback(data) {
            if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
                let doc = data[google.picker.Response.DOCUMENTS][0];
                let fileId = doc[google.picker.Document.ID];
                let fileName = encodeURIComponent(doc[google.picker.Document.NAME]);
                
                window.location.href = `${SCHEME}://picker-callback?fileId=${fileId}&fileName=${fileName}`;
            } else if (data[google.picker.Response.ACTION] === google.picker.Action.CANCEL) {
                window.location.href = `${SCHEME}://picker-callback?cancelled=true`;
            }
        }
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</head>
<body style="background-color: #121212; color: white; text-align: center; padding-top: 120px; font-family: -apple-system, sans-serif;">
    <h3 id="loaderText">Connect Google Drive</h3>
    <br>
    <button id="authButton" onclick="handleAuthClick()" style="background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer;">
        Sign In & Select Audio
    </button>
</body>
</html>
