<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        /* Ensure the picker dialog scales cleanly inside mobile viewports */
        .picker-dialog {
            max-width: 100% !important;
            max-height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            transform: none !important;
        }
    </style>
    <meta charset="utf-8">
    <title>Google Drive Picker</title>
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        const CLIENT_ID = urlParams.get('client_id');
        const APP_ID = urlParams.get('app_id');
        const SCHEME = urlParams.get('scheme');
        
        let tokenClient;
        let pickerInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('picker', { callback: () => { pickerInited = true; checkReady(); } });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        createPicker(tokenResponse.access_token);
                    }
                },
            });
            gisInited = true;
            checkReady();
        }

        function checkReady() {
            if (pickerInited && gisInited) {
                document.getElementById('loaderText').style.display = 'none';
                document.getElementById('pickerButton').style.display = 'block';
            }
        }

        // Triggered by explicit user click to satisfy Google's popup policy
        function handleOpenPicker() {
            tokenClient.requestAccessToken({ prompt: 'select_account' });
        }

        function createPicker(accessToken) {
            document.getElementById('pickerButton').style.display = 'none';
            document.getElementById('loaderText').innerText = "Loading Picker...";
            document.getElementById('loaderText').style.display = 'block';

            let view = new google.picker.DocsView(google.picker.ViewId.DOCS);
            view.setMimeTypes('audio/mpeg,audio/mp4,audio/wav,audio/aac,audio/x-m4a');
            view.setIncludeFolders(true);
            view.setMode(google.picker.DocsViewMode.LIST);

            let picker = new google.picker.PickerBuilder()
                .enableFeature(google.picker.Feature.NAV_HIDDEN)
                .enableFeature(google.picker.Feature.MULTISELECT_ENABLED):
                .setAppId(APP_ID)
                .setOAuthToken(accessToken)
                .addView(view)
                .setCallback((data) => pickerCallback(data, accessToken))
                .build();
            picker.setVisible(true);
        }

        function pickerCallback(data, accessToken) {
            if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
                let doc = data[google.picker.Response.DOCUMENTS][0];
                let fileId = doc[google.picker.Document.ID];
                let fileName = encodeURIComponent(doc[google.picker.Document.NAME]);
                
                window.location.href = `${SCHEME}://picker-callback?fileId=${fileId}&fileName=${fileName}&accessToken=${accessToken}`;
            } else if (data[google.picker.Response.ACTION] === google.picker.Action.CANCEL) {
                window.location.href = `${SCHEME}://picker-callback?cancelled=true`;
            }
        }
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</head>
<body style="background-color: #121212; color: white; text-align: center; padding-top: 140px; font-family: -apple-system, sans-serif;">
    <h3 id="loaderText">Initializing...</h3>
    <button id="pickerButton" onclick="handleOpenPicker()" style="display: none; background-color: #4285F4; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 0 auto;">
        Open Google Drive Picker
    </button>
</body>
</html>
